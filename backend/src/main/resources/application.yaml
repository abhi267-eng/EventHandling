ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.eventhandling.HttpKt.configureHttp
      - com.eventhandling.SerializationKt.configureSerialization
      - com.eventhandling.ErrorsKt.configureErrors
      - com.eventhandling.PostgresKt.configurePostgres
      - com.eventhandling.AuthenticationKt.configureAuthentication
      - com.eventhandling.RoutingKt.configureRouting

postgres:
  url: jdbc:postgresql://localhost:5432/eventhandling
  user: postgres
  password: "$DATABASE_PASSWORD"

jwt:
  secret: "$JWT_SECRET"
  issuer: "eventhandling"
  audience: "eventhandling-users"
  expiration: 86400000

setup:
  platform-admin-secret: "$SETUP_SECRET"